name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-mock pydantic pyyaml boto3 snowflake-connector-python dbt-snowflake

      - name: Run Ruff Linter
        run: |
          ruff check . --select=E9,F63,F7,F82 --show-source

      - name: Run Pytest Unit Tests
        run: |
          pytest tests/ -v

      - name: Validate dbt Syntax & Models
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT || 'dummy_account' }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER || 'dummy_user' }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD || 'dummy_password' }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || 'SYSADMIN' }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || 'TELEMETRY_DB' }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA || 'DEV' }}
        run: |
          mkdir -p ~/.dbt
          echo "telemetry_dbt:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: dummy_account
                user: dummy_user
                password: dummy_password
                role: SYSADMIN
                database: TELEMETRY_DB
                warehouse: COMPUTE_WH
                schema: DEV
                threads: 1
                client_session_keep_alive: False" > ~/.dbt/profiles.yml
          dbt parse --profiles-dir ~/.dbt
