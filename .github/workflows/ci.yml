name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-mock pydantic pyyaml boto3 snowflake-connector-python dbt-snowflake apache-airflow

      - name: Run Ruff Linter
        run: |
          ruff check . --select=E9,F63,F7,F82

      - name: Run Pytest Unit Tests
        run: |
          pytest tests/ -v

      - name: Validate dbt Syntax & Models
        run: |
          mkdir -p ~/.dbt
          printf "telemetry_dbt:\n  target: dev\n  outputs:\n    dev:\n      type: snowflake\n      account: dummy_account\n      user: dummy_user\n      password: dummy_password\n      role: SYSADMIN\n      database: TELEMETRY_DB\n      warehouse: COMPUTE_WH\n      schema: DEV\n      threads: 1\n      client_session_keep_alive: False\n" > ~/.dbt/profiles.yml
          dbt parse --profiles-dir ~/.dbt
